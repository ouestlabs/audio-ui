name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: lets `npm publish` exchange this job's OIDC token
      # for a short-lived publish token (a no-op until the trusted publisher is
      # configured on npmjs.com).
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 bundles.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v2
        with:
          version-script: bun version-packages
          publish-script: bun release
          # The default commits through the API on a temporary branch and then
          # deletes it, which the "Contribution Workflow" ruleset forbids on
          # every branch but changeset-release/main. The git CLI pushes straight
          # to that branch instead.
          push-with-git-cli: true
        env:
          # The fallback while no trusted publisher is configured. Once a release
          # has published through OIDC, remove this line and the NPM_TOKEN secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
