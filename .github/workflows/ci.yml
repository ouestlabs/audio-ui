name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome ci packages/core packages/engine packages/ui packages/icons packages/elements

      - name: Build
        run: bun run build:pkg

      - name: Typecheck core
        working-directory: packages/core
        run: bunx tsc --noEmit

      - name: Typecheck engine
        working-directory: packages/engine
        run: bunx tsc --noEmit

      - name: Typecheck ui
        working-directory: packages/ui
        run: bunx tsc --noEmit

      - name: Typecheck icons
        working-directory: packages/icons
        run: bunx tsc --noEmit

      - name: Typecheck elements
        working-directory: packages/elements
        run: bunx tsc --noEmit

      - name: Test core
        working-directory: packages/core
        run: bun test

      - name: Test engine
        working-directory: packages/engine
        run: bun test

      - name: Test ui
        working-directory: packages/ui
        run: bun test

      - name: Test icons
        working-directory: packages/icons
        run: bun test

      - name: Test elements
        working-directory: packages/elements
        run: bun test

      - name: Size budgets
        working-directory: packages/ui
        run: bun run size

      - name: Size budgets and registration of elements
        working-directory: packages/elements
        run: bun run size

      - name: Typecheck www
        working-directory: apps/www
        run: bun run typecheck

      - name: Agent skill and docs match the code
        working-directory: apps/www
        run: bun test test/skills.test.ts test/install-paths.test.ts

      # The DAW's own code: what it installs from the registry is checked where it comes from.
      - name: Lint daw
        working-directory: apps/daw
        run: bunx biome ci src/components/daw src/routes src/lib/daw test

      - name: Typecheck daw
        working-directory: apps/daw
        run: bun run typecheck

      - name: Test daw
        working-directory: apps/daw
        run: bun test
