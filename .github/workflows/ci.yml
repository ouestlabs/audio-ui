name: CI

on:
  pull_request:
    branches:
      - main
  # The Release workflow runs it on its pull request: a push made with the
  # workflow's own token starts no workflow, and main requires these checks.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome ci packages/icons apps/www/src/registry/lib/engine apps/www/src/registry/lib/gl

      - name: Build
        run: bun run build:pkg

      - name: Typecheck icons
        working-directory: packages/icons
        run: bunx tsc --noEmit

      - name: Test engine and gl
        working-directory: apps/www
        run: bun test src/registry/lib

      - name: Test icons
        working-directory: packages/icons
        run: bun test

      - name: Primitives in React, Vue, Svelte and custom elements
        working-directory: apps/www
        run: bun run test:primitives

      - name: Typecheck www
        working-directory: apps/www
        run: bun run typecheck

      - name: Agent skill and docs match the code
        working-directory: apps/www
        run: bun test test/skills.test.ts test/install-paths.test.ts

      # The DAW's own code: what it installs from the registry is checked where it comes from.
      - name: Lint daw
        working-directory: apps/daw
        run: bunx biome ci src/components/daw src/routes src/lib/daw test

      - name: Typecheck daw
        working-directory: apps/daw
        run: bun run typecheck

      - name: Test daw
        working-directory: apps/daw
        run: bun test
